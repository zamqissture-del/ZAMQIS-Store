
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAMQIS STORE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090817;color:#fff;
 font-family:Arial,sans-serif
}
header{
 padding:18px 6%;display:flex;
 justify-content:space-between;align-items:center;
 background:#100d25;border-bottom:1px solid #39265e
}
.logo{font-size:22px;font-weight:bold;letter-spacing:2px}
.logo span{color:#43e8ff}
a{color:#fff;text-decoration:none}
main{max-width:1000px;margin:auto;padding:25px 18px}
.hero{
 padding:40px 25px;border-radius:20px;
 background:linear-gradient(120deg,#35145e,#101c3c);
 border:1px solid #7650b4
}
.hero h1{font-size:40px;margin:10px 0}
.hero p{color:#c7c2e5}
h2{margin-top:30px}
.games,.packages{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
 gap:12px
}
.card{
 padding:18px;background:#17142d;
 border:1px solid #393052;border-radius:14px;
 cursor:pointer
}
.card.active{border-color:#43e8ff;box-shadow:0 0 15px #43e8ff22}
.card strong{display:block;margin-bottom:8px}
.card small{color:#43e8ff}
label{display:block;color:#bcb7d5;font-size:13px;margin:12px 0 6px}
input{
 width:100%;padding:13px;border-radius:10px;
 background:#100d23;border:1px solid #393052;color:white
}
button{
 padding:13px 18px;border:0;border-radius:10px;
 color:white;background:linear-gradient(100deg,#9b5cff,#526eff);
 font-weight:bold;cursor:pointer
}
.summary{
 margin-top:18px;padding:20px;
 background:#17142d;border:1px solid #6943a3;border-radius:15px
}
.total{font-size:28px;color:#43e8ff;font-weight:bold}
footer{text-align:center;color:#999;padding:25px}
</style>
</head>
<body>

<header>
 <div class="logo">ZAMQIS<span> STORE</span></div>
 <a href="admin.html">ADMIN ↗</a>
</header>

<main>
<section class="hero">
 <small style="color:#43e8ff">TOP UP GAME • CEPAT • AMAN</small>
 <h1>POWER UP<br>YOUR GAME.</h1>
 <p>Top up game favoritmu dengan mudah di ZAMQIS STORE.</p>
</section>

<h2>🎮 Pilih Game</h2>
<div class="games" id="games"></div>

<h2>💎 Pilih Paket</h2>
<div class="packages" id="packages"></div>

<h2>🧾 Data Pesanan</h2>
<label>ID Player</label>
<input id="player" placeholder="Masukkan ID Player">

<label>Server / Zone (jika ada)</label>
<input id="server" placeholder="Masukkan server">

<label>Nama Pembeli</label>
<input id="buyer" placeholder="Nama kamu">

<div class="summary">
 <div>Total Pembayaran</div>
 <div class="total" id="total">Rp0</div>
 <p style="color:#aaa">Klik tombol berikut untuk mengirim pesanan ke WhatsApp admin.</p>
 <button onclick="order()">PESAN VIA WHATSAPP ↗</button>
</div>
</main>

<footer>© ZAMQIS STORE • Game on, top up easy.</footer>

<script>
const defaultPrices={
 "Free Fire":[
  ["70 Diamond",10000],
  ["140 Diamond",19000],
  ["355 Diamond",47000],
  ["720 Diamond",92000]
 ],
 "PUBG Mobile":[
  ["60 UC",15000],
  ["325 UC",75000],
  ["660 UC",145000]
 ],
 "Mobile Legends":[
  ["86 Diamond",20000],
  ["172 Diamond",39000],
  ["257 Diamond",58000]
 ]
};

let prices;
try{
 prices=JSON.parse(localStorage.getItem("zamqisPrices"))||defaultPrices;
}catch(e){prices=defaultPrices}

let game="Free Fire";
let selected=0;

function rupiah(n){
 return "Rp"+Number(n).toLocaleString("id-ID");
}

function renderGames(){
 document.getElementById("games").innerHTML=
 Object.keys(prices).map(g=>`
 <div class="card ${g===game?'active':''}" onclick="selectGame('${g}')">
  <strong>${g}</strong>
  <small>Pilih Game →</small>
 </div>`).join("");
}

function renderPackages(){
 let list=prices[game]||[];
 selected=0;

 document.getElementById("packages").innerHTML=
 list.map((p,i)=>`
 <div class="card ${i===0?'active':''}" onclick="selectPackage(${i})">
  <strong>${p[0]}</strong>
  <small>${rupiah(p[1])}</small>
 </div>`).join("");

 document.getElementById("total").textContent=
 list.length?rupiah(list[0][1]):"Rp0";
}

function selectGame(g){
 game=g;
 renderGames();
 renderPackages();
}

function selectPackage(i){
 selected=i;
 document.querySelectorAll("#packages .card").forEach((c,n)=>{
  c.classList.toggle("active",n===i);
 });
 document.getElementById("total").textContent=
 rupiah(prices[game][i][1]);
}

function order(){
 const player=document.getElementById("player").value.trim();
 const server=document.getElementById("server").value.trim();
 const buyer=document.getElementById("buyer").value.trim();

 if(!player||!buyer){
  alert("Isi ID Player dan Nama Pembeli terlebih dahulu.");
  return;
 }

 const p=prices[game][selected];

 const message=
 `Halo Admin ZAMQIS STORE, saya ingin top up.%0A%0A`+
 `Game: ${game}%0A`+
 `Paket: ${p[0]}%0A`+
 `ID Player: ${player}%0A`+
 `Server: ${server||"-"}%0A`+
 `Nama: ${buyer}%0A`+
 `Total: ${rupiah(p[1])}`;

 // GANTI NOMOR DI BAWAH DENGAN NOMOR WHATSAPP ADMIN
 const admin="6281234567890";

 window.open("https://wa.me/"+admin+"?text="+message,"_blank");
}

renderGames();
renderPackages();
</script>
</body>
</html>
